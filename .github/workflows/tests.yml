---
name: Tests
on:
  push:
    branches: [main]
  pull_request:
env:
  XCODE_VERSION: '26.4.1'
jobs:
  ui-ios:
    name: UI Tests (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate project.yml from template
        run: |
          sed \
            -e 's/YOUR_TEAM_ID//' \
            -e 's/com\.yourteam/com.ci/' \
            -e 's/YOUR_SPOTIFY_CLIENT_ID/placeholder/' \
            -e 's/YOUR_GOOGLE_CLIENT_ID/placeholder/' \
            project.yml.template > project.yml
      - name: Patch mock flags into scheme environment
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          scheme = pathlib.Path('project.yml')
          text = scheme.read_text()
          # Flip all mock flags to 1 so the UI test runner uses fixture data
          text = re.sub(r"(USE_MOCK_\w+: )'0'", r"\g<1>'1'", text)
          scheme.write_text(text)
          PYEOF
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run UI tests on iOS Simulator
        run: mise run tests-ui-ios

  ui-mac:
    name: UI Tests (Mac)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate project.yml from template
        run: |
          sed \
            -e 's/YOUR_TEAM_ID//' \
            -e 's/com\.yourteam/com.ci/' \
            -e 's/YOUR_SPOTIFY_CLIENT_ID/placeholder/' \
            -e 's/YOUR_GOOGLE_CLIENT_ID/placeholder/' \
            project.yml.template > project.yml
      - name: Patch mock flags into scheme environment
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          scheme = pathlib.Path('project.yml')
          text = scheme.read_text()
          # Flip all mock flags to 1 so the UI test runner uses fixture data
          text = re.sub(r"(USE_MOCK_\w+: )'0'", r"\g<1>'1'", text)
          scheme.write_text(text)
          PYEOF
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pre-authorize accessibility for UI tests
        run: |
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          TS=$(date +%s)
          # INSERT OR REPLACE so any existing denied row is overwritten.
          # Authorize both xctest.tool (the test runner binary) and the app bundle itself.
          COLS="service,client,client_type,auth_value,auth_reason,"
          COLS+="auth_version,csreq,policy_id,indirect_object_identifier_type,"
          COLS+="indirect_object_identifier,indirect_object_attributes,flags,last_modified"
          ROW_TOOL="('kTCCServiceAccessibility','com.apple.dt.xctest.tool',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$TS)"
          ROW_APP="('kTCCServiceAccessibility','com.ci.sonas.mac',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$TS)"
          ROW_TESTS="('kTCCServiceAccessibility','com.ci.sonas.mac.uitests',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$TS)"
          sudo sqlite3 "$TCC_DB" \
            "INSERT OR REPLACE INTO access ($COLS) VALUES $ROW_TOOL,$ROW_APP,$ROW_TESTS;"
      - name: Run UI tests
        run: mise run tests-ui-mac

  ui-tv:
    name: UI Tests (tvOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install tvOS Simulator runtime
        run: xcodebuild -downloadPlatform tvOS || true
      - name: Generate project.yml from template
        run: |
          sed \
            -e 's/YOUR_TEAM_ID//' \
            -e 's/com\.yourteam/com.ci/' \
            -e 's/YOUR_SPOTIFY_CLIENT_ID/placeholder/' \
            -e 's/YOUR_GOOGLE_CLIENT_ID/placeholder/' \
            project.yml.template > project.yml
      - name: Patch mock flags into scheme environment
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          scheme = pathlib.Path('project.yml')
          text = scheme.read_text()
          # Flip all mock flags to 1 so the UI test runner uses fixture data
          text = re.sub(r"(USE_MOCK_\w+: )'0'", r"\g<1>'1'", text)
          scheme.write_text(text)
          PYEOF
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run UI tests on tvOS Simulator
        run: mise run tests-ui-tv

  unit-contract-ios:
    name: Unit & Contract Tests (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate project.yml from template
        run: |
          sed \
            -e 's/YOUR_TEAM_ID//' \
            -e 's/com\.yourteam/com.ci/' \
            -e 's/YOUR_SPOTIFY_CLIENT_ID/placeholder/' \
            -e 's/YOUR_GOOGLE_CLIENT_ID/placeholder/' \
            project.yml.template > project.yml
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run unit and contract tests on iOS Simulator
        run: mise run tests-unit-ios

  unit-contract-mac:
    name: Unit & Contract Tests (Mac)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate project.yml from template
        run: |
          sed \
            -e 's/YOUR_TEAM_ID//' \
            -e 's/com\.yourteam/com.ci/' \
            -e 's/YOUR_SPOTIFY_CLIENT_ID/placeholder/' \
            -e 's/YOUR_GOOGLE_CLIENT_ID/placeholder/' \
            project.yml.template > project.yml
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run unit and contract tests
        run: mise run tests-unit-mac

  unit-watch:
    name: Unit Tests (watchOS build check)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install watchOS Simulator runtime
        run: xcodebuild -downloadPlatform watchOS || true
      - name: Generate project.yml from template
        run: |
          sed \
            -e 's/YOUR_TEAM_ID//' \
            -e 's/com\.yourteam/com.ci/' \
            -e 's/YOUR_SPOTIFY_CLIENT_ID/placeholder/' \
            -e 's/YOUR_GOOGLE_CLIENT_ID/placeholder/' \
            project.yml.template > project.yml
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build WatchSonas (watchOS compilation check)
        run: mise run tests-unit-watch
