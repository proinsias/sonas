          fi

      - name: Generate project.yml from template
        run: |
          sed \
            -e 's/YOUR_TEAM_ID//' \
            -e 's/com\.yourteam/com.ci/' \
            -e 's/YOUR_SPOTIFY_CLIENT_ID/placeholder/' \
            -e 's/YOUR_GOOGLE_CLIENT_ID/placeholder/' \
            project.yml.template > project.yml

      - name: Patch mock flags into scheme environment
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          scheme = pathlib.Path('project.yml')
          text = scheme.read_text()
          # Flip all mock flags to 1 so the UI test runner uses fixture data
          text = re.sub(r"(USE_MOCK_\w+: )'0'", r"\g<1>'1'", text)
          scheme.write_text(text)
          PYEOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run UI tests
        run: mise run tests-ui-mac

  ui-tv:
    name: UI Tests (tvOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode 16.3 (if available)
        run: |
          if [ -d /Applications/Xcode_16.3.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_16.3.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Install tvOS 18.4 Simulator runtime
        run: |
          # Use DEVELOPMENT_DIR if set, otherwise default to Xcode.app
          XCODE_PATH=$(xcode-select -p)

          # Force download and install of the tvOS 18.4 platform
          # This should be more robust than just -downloadPlatform
          "$XCODE_PATH"/usr/bin/xcodebuild -downloadPlatform tvOS

          # Find and boot the Apple TV 4K (3rd generation) simulator
          SIM_NAME="Apple TV 4K (3rd generation)"
          SIM_ID=$(xcrun simctl list devices available \
              | grep "$SIM_NAME" \
              | grep -v "1080p" \
              | sed 's/.*(\([A-Z0-9-]*\)).*/\1/' \
              | head -1)

          if [ -z "$SIM_ID" ]; then
              echo "Error: $SIM_NAME Simulator not found." >&2
              exit 1
          fi

          echo "Found $SIM_NAME Simulator with ID: $SIM_ID"

          # Shutdown and erase to ensure a clean state
          xcrun simctl shutdown "$SIM_ID" 2>/dev/null || true
          xcrun simctl erase "$SIM_ID" 2>/dev/null || true

          # Boot the simulator
          xcrun simctl boot "$SIM_ID" || true
          # Give it a moment to fully boot
          sleep 10

      - name: Generate project.yml from template
        run: |
          sed \
            -e 's/YOUR_TEAM_ID//' \
            -e 's/com\.yourteam/com.ci/' \
            -e 's/YOUR_SPOTIFY_CLIENT_ID/placeholder/' \
            -e 's/YOUR_GOOGLE_CLIENT_ID/placeholder/' \
            project.yml.template > project.yml

      - name: Patch mock flags into scheme environment
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          scheme = pathlib.Path('project.yml')
          text = scheme.read_text()
          # Flip all mock flags to 1 so the UI test runner uses fixture data
          text = re.sub(r"(USE_MOCK_\w+: )'0'", r"\g<1>'1'", text)
          scheme.write_text(text)
          PYEOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run UI tests on tvOS Simulator
        run: mise run tests-ui-tv

