  unit-watch:
    name: Unit Tests (watchOS build check)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode 16.3 (if available)
        run: |
